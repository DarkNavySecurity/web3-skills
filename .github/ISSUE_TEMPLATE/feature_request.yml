name: Feature Request
description: Suggest a new pattern, technique, or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: skill
    attributes:
      label: Skill
      description: Which skill does this relate to?
      options:
        - client-auditor
        - contract-auditor
        - exploit-investigator
        - General / cross-skill
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Type of change
      options:
        - New attack pattern / vulnerability family
        - Analysis technique or heuristic
        - Agent prompt improvement
        - Report formatting
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? What gap does it fill?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the change you'd like. For new patterns, include the real-world bug class it addresses.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: References, examples, or related issues.
